<!-- og:image must be an absolute URL: KakaoTalk, Facebook and Slack fetch it
     from their own servers, where a path relative to this page means nothing.
     It is also a JPEG rather than WebP, because several of those crawlers
     still decode WebP unreliably and a share card that fails to render is
     worse than one that is a few kilobytes heavier. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Skinverse">
<meta property="og:url" content="https://www.universe-skin.com/">
<meta property="og:title" content="Skinverse · K-Beauty AI Skin Lab">
<meta property="og:description" content="피부를 읽고, 오늘 날씨에 맞는 루틴을 짜고, 화장품 전성분을 식약처 등록 정보와 대조합니다.">
<meta property="og:image" content="https://www.universe-skin.com/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Skinverse">
<meta property="og:locale" content="ko_KR">
